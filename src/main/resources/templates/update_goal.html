<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach — Edit Goal</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="app-page">
<div th:replace="fragments :: nav"></div>

<main class="app-main">
    <div th:replace="fragments :: flash"></div>

    <div class="page-header">
        <h1 class="page-title">Edit goal</h1>
        <a th:href="@{'/goal/' + ${goal.goalId}}" class="btn btn-outline">Cancel</a>
    </div>

    <div class="form-card">
        <form th:action="@{/updateGoal}" th:object="${goal}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" th:field="*{goalId}"/>

            <div class="form-group">
                <label for="title">Goal title <span class="required">*</span></label>
                <input type="text" id="title" th:field="*{title}"
                       maxlength="120" required class="form-control">
            </div>

            <div class="form-group">
                <label for="description">Why this goal matters</label>
                <textarea id="description" th:field="*{description}"
                          maxlength="2000" rows="3" class="form-control"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group form-col">
                    <label for="targetDate">Target date <span class="required">*</span></label>
                    <input type="date" id="targetDate" th:field="*{targetDate}"
                           required class="form-control">
                </div>

                <div class="form-group form-col">
                    <label for="weeklyCapacityMinutes">Weekly capacity (minutes)</label>
                    <input type="number" id="weeklyCapacityMinutes" th:field="*{weeklyCapacityMinutes}"
                           min="30" max="4200" class="form-control">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group form-col">
                    <label for="priority">Priority</label>
                    <select id="priority" th:field="*{priority}" class="form-control">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>

                <div class="form-group form-col">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}" class="form-control">
                        <option value="DRAFT">Draft</option>
                        <option value="PLANNING">Planning</option>
                        <option value="ACTIVE">Active</option>
                        <option value="PAUSED">Paused</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="ABANDONED">Abandoned</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="successCriteria">Success criteria</label>
                <textarea id="successCriteria" th:field="*{successCriteria}"
                          maxlength="1000" rows="2" class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label for="motivation">Motivation</label>
                <textarea id="motivation" th:field="*{motivation}"
                          maxlength="1000" rows="2" class="form-control"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save changes</button>
                <a th:href="@{'/goal/' + ${goal.goalId}}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="fragments :: mobile-nav"></div>
</body>
</html>
