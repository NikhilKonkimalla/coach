<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach — Edit Task</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="app-page">
<div th:replace="fragments :: nav"></div>

<main class="app-main">
    <div th:replace="fragments :: flash"></div>

    <div class="page-header">
        <h1 class="page-title">Edit task</h1>
        <a th:href="@{'/task/' + ${task.taskId}}" class="btn btn-outline">Cancel</a>
    </div>

    <div class="form-card">
        <form th:action="@{'/task/' + ${task.taskId} + '/save'}" th:object="${task}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="title">Task title <span class="required">*</span></label>
                <input type="text" id="title" th:field="*{title}"
                       maxlength="200" required class="form-control">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"
                          rows="3" class="form-control"></textarea>
            </div>

            <div class="form-group">
                <label for="definitionOfDone">Definition of done</label>
                <p class="help-text">How will you know this task is complete?</p>
                <input type="text" id="definitionOfDone" th:field="*{definitionOfDone}" class="form-control">
            </div>

            <div class="form-row">
                <div class="form-group form-col">
                    <label for="estimatedMinutes">Estimated minutes</label>
                    <input type="number" id="estimatedMinutes" th:field="*{estimatedMinutes}"
                           min="1" class="form-control">
                </div>
                <div class="form-group form-col">
                    <label for="dueDate">Due date</label>
                    <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group form-col">
                    <label for="priority">Priority</label>
                    <select id="priority" th:field="*{priority}" class="form-control">
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                </div>
                <div class="form-group form-col">
                    <label for="schedulingType">Type</label>
                    <select id="schedulingType" th:field="*{schedulingType}" class="form-control">
                        <option value="CHECKLIST">Checklist</option>
                        <option value="TIME_BLOCK">Time block</option>
                        <option value="REMINDER">Reminder</option>
                        <option value="MILESTONE_MARKER">Milestone marker</option>
                    </select>
                </div>
                <div class="form-group form-col">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}" class="form-control">
                        <option value="READY">Ready</option>
                        <option value="IN_PROGRESS">In progress</option>
                        <option value="BLOCKED">Blocked</option>
                        <option value="DEFERRED">Deferred</option>
                        <option value="COMPLETED">Completed</option>
                        <option value="SKIPPED">Skipped</option>
                        <option value="CANCELED">Canceled</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save changes</button>
                <a th:href="@{'/task/' + ${task.taskId}}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="fragments :: mobile-nav"></div>
</body>
</html>
