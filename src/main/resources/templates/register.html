<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach — Create Account</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-brand">
        <h1 class="auth-logo">Coach</h1>
        <p class="auth-tagline">Start turning your goals into action.</p>
    </div>

    <div class="auth-card">
        <h2>Create your account</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register-submit}" th:object="${user}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="displayName">Your name</label>
                <input type="text" id="displayName" th:field="*{displayName}"
                       placeholder="Jane Smith" required class="form-control">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="you@example.com" required class="form-control">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"
                       placeholder="Choose a strong password" required minlength="8"
                       class="form-control">
                <span class="help-text">At least 8 characters.</span>
            </div>
            <div class="form-group">
                <label for="timeZone">Time zone</label>
                <select id="timeZone" th:field="*{timeZone}" class="form-control">
                    <option value="America/New_York">Eastern (ET)</option>
                    <option value="America/Chicago">Central (CT)</option>
                    <option value="America/Denver">Mountain (MT)</option>
                    <option value="America/Los_Angeles">Pacific (PT)</option>
                    <option value="America/Anchorage">Alaska (AKT)</option>
                    <option value="Pacific/Honolulu">Hawaii (HST)</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </form>

        <div class="auth-links">
            <a href="/login">Already have an account? Sign in</a>
        </div>
    </div>
</div>
</body>
</html>
