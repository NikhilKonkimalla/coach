<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach — Change Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="app-page">
<div th:replace="fragments :: nav"></div>

<main class="app-main">
    <div th:replace="fragments :: flash"></div>

    <div class="page-header">
        <h1 class="page-title">Change password</h1>
        <a href="/dashboard" class="btn btn-outline">Cancel</a>
    </div>

    <div class="form-card">
        <form th:action="@{/change-password}" method="post" novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="form-group">
                <label for="currentPassword">Current password <span class="required">*</span></label>
                <input type="password" id="currentPassword" name="currentPassword"
                       required class="form-control" autocomplete="current-password">
            </div>

            <div class="form-group">
                <label for="newPassword">New password <span class="required">*</span></label>
                <p class="help-text">At least 8 characters.</p>
                <input type="password" id="newPassword" name="newPassword"
                       minlength="8" required class="form-control" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm new password <span class="required">*</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       minlength="8" required class="form-control" autocomplete="new-password">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Update password</button>
                <a href="/dashboard" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<div th:replace="fragments :: mobile-nav"></div>
</body>
</html>
