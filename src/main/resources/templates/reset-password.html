<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach — Set New Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-brand">
        <h1 class="auth-logo">Coach</h1>
        <p class="auth-tagline">Turn your goals into action.</p>
    </div>

    <div class="auth-card">
        <h2>Set a new password</h2>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="token" th:value="${token}"/>

            <div class="form-group">
                <label for="newPassword">New password</label>
                <p class="help-text">At least 8 characters.</p>
                <input type="password" id="newPassword" name="newPassword"
                       minlength="8" required autofocus class="form-control" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm new password</label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       minlength="8" required class="form-control" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Reset password</button>
        </form>

        <div class="auth-links">
            <a href="/login">Back to sign in</a>
        </div>
    </div>
</div>
</body>
</html>
