<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coach — Reset Password</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
</head>
<body class="auth-page">
<div class="auth-container">
    <div class="auth-brand">
        <h1 class="auth-logo">Coach</h1>
        <p class="auth-tagline">Turn your goals into action.</p>
    </div>

    <div class="auth-card">
        <h2>Reset your password</h2>
        <p class="help-text">Enter your email and we'll send you a link to reset your password.</p>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" method="post" class="auth-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email"
                       placeholder="you@example.com" required autofocus
                       class="form-control">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
        </form>

        <div class="auth-links">
            <a href="/login">Back to sign in</a>
        </div>
    </div>
</div>
</body>
</html>
