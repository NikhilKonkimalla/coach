logging.level.root=INFO
logging.level.org.kidscircle=DEBUG

# ── Database ───────────────────────────────────────────────────
# Override with DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD
# in production, or use an application-local.properties for local.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/kidscircle}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:Qwerty!234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect
# update: adds new columns without dropping existing ones — safe for iterative dev
spring.jpa.hibernate.ddl-auto=update

# ── Server ─────────────────────────────────────────────────────
server.port=${PORT:5000}

# ── Security ───────────────────────────────────────────────────
# Set SESSION_COOKIE_SECURE=true in production (requires HTTPS)
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# ── Thymeleaf ──────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Ollama (local AI) ──────────────────────────────────────────
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen3:8b}

# ── Mail (password reset) ───────────────────────────────────────
# Override with MAIL_HOST / MAIL_PORT / MAIL_USERNAME / MAIL_PASSWORD.
# For Gmail: host smtp.gmail.com, port 587, and an App Password (not your account password).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@coach.local}
# Used to build links inside emails sent from scheduled jobs (no HTTP request to derive it from)
app.base-url=${APP_BASE_URL:http://localhost:5000}
